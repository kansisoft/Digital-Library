<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e8;--card:#fff;--ink:#1a1208;--muted:#7a6e5f;--border:#e4ddd3;--border2:#cfc5b5;--surface2:#ede8df}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.page{max-width:1140px;margin:0 auto;padding:0 18px 60px}
header{background:#1a1208;color:#f5f0e8;padding:26px 18px 20px;position:relative}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#b84c2e,#f39c12,#639922,#378ADD,#534AB7)}
.hinner{max-width:1140px;margin:0 auto;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:'Lora',serif;font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:700;letter-spacing:-.5px}
header h1 span{color:#f39c12}
header p{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:rgba(245,240,232,.4);margin-top:4px}
.visitor-banner{background:#fff8ec;border-bottom:1px solid #f0d98c;padding:10px 18px}
.visitor-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.visitor-inner label{font-size:13px;color:#7a5c00;font-weight:500}
.visitor-inner input{padding:6px 10px;border:1px solid #f0d98c;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;background:#fff;color:var(--ink);outline:none;width:160px}
.visitor-inner input:focus{border-color:#EF9F27}
.visitor-inner .vsave{padding:6px 12px;background:#EF9F27;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif}
.visitor-inner .vgreet{font-size:13px;color:#7a5c00}
.visitor-inner .vchange{font-size:11px;color:#185FA5;cursor:pointer;border:none;background:none;text-decoration:underline;font-family:'DM Sans',sans-serif}
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0 10px}
.sc{background:var(--surface2);border-radius:8px;padding:8px 10px}
.sc .sv{font-size:19px;font-weight:500;line-height:1.1}
.sc .sk{font-size:10px;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.4px}
.sticky-bar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.topbar{max-width:1140px;margin:0 auto;padding:9px 18px 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.topbar input[type=text]{flex:1;min-width:140px;padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--ink);outline:none}
.topbar input[type=text]:focus{border-color:#185FA5}
.topbar select{padding:7px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);cursor:pointer;outline:none;min-width:100px}
.btn{padding:7px 11px;border:1px solid var(--border2);border-radius:7px;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--surface2)}
.btn-pri{background:var(--ink);color:var(--bg);border-color:transparent}
.btn-pri:hover{opacity:.85;background:var(--ink)}
.btn-active{background:#185FA5;color:#fff;border-color:transparent}
.tabs-wrap{max-width:1140px;margin:0 auto;padding:7px 18px 8px;display:flex;gap:5px;flex-wrap:wrap}
.tab{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);white-space:nowrap;font-family:'DM Sans',sans-serif}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* panels */
.panel{max-width:1140px;margin:10px auto 0;padding:0 18px;display:none}
.panel-inner{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px}
.panel-inner h3{font-size:14px;font-weight:500;margin-bottom:11px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:11px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--card);color:var(--ink);outline:none}
.fg input:focus,.fg select:focus{border-color:#185FA5}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scan-zone{border:2px dashed var(--border2);border-radius:8px;padding:18px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:11px}
.scan-zone:hover{border-color:#185FA5}
.scan-zone input{display:none}
.scan-status{font-size:12px;color:var(--muted);margin-top:5px;min-height:16px}
.scan-preview{max-width:100px;max-height:140px;border-radius:6px;margin:6px auto 0;display:none}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:3px}
@keyframes spin{to{transform:rotate(360deg)}}
/* lent panel */
.lent-list{display:flex;flex-direction:column;gap:7px;max-height:380px;overflow-y:auto}
.lent-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.lent-item .li-title{font-size:13px;font-weight:500;flex:1}
.lent-item .li-to{font-size:11px;color:#854F0B;background:#FAEEDA;padding:2px 6px;border-radius:3px;flex-shrink:0}
.lent-item .li-date{font-size:10px;color:var(--muted);flex-shrink:0}
.lent-item .li-ret{font-size:11px;cursor:pointer;color:#185FA5;border:none;background:none;font-family:'DM Sans',sans-serif;text-decoration:underline;text-decoration-style:dotted;flex-shrink:0}
/* info */
.info{font-size:12px;color:var(--muted);padding:6px 0 3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:0 0 9px;align-items:center}
.lsq{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0;vertical-align:middle;margin-right:3px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.card.archived{opacity:.4;filter:grayscale(.6)}
/* cover */
.cover-wrap{position:relative;aspect-ratio:2/3;overflow:hidden}
.cover-wrap img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;display:block}
.cover-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px}
.cover-ph .ini{font-family:'Lora',serif;font-size:34px;font-weight:700;line-height:1;opacity:.75}
.cover-ph .pt{font-size:9px;text-align:center;line-height:1.3;opacity:.55;max-width:90%}
.type-badge{position:absolute;top:6px;right:6px;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.3px}
.type-physical{background:rgba(39,80,10,.85);color:#C0DD97}
.type-digital{background:rgba(12,68,124,.85);color:#B5D4F4}
.type-past{background:rgba(83,74,183,.82);color:#CECBF6}
.lent-badge{position:absolute;bottom:22px;left:0;right:0;text-align:center;background:rgba(239,159,39,.92);color:#fff;font-size:9px;font-weight:600;padding:3px 0}
.archived-badge{position:absolute;top:34px;left:6px;background:rgba(90,80,70,.8);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600}
.vis-read-badge{position:absolute;bottom:22px;left:0;right:0;text-align:center;background:rgba(57,109,17,.9);color:#fff;font-size:9px;font-weight:600;padding:3px 0}
.refresh-btn{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;cursor:pointer;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.cover-wrap:hover .refresh-btn{opacity:1}
.refresh-btn:hover{background:rgba(0,0,0,.8)}
.sbar{position:absolute;bottom:0;left:0;right:0;height:3px}
/* meta */
.cmeta{padding:8px 9px 4px;flex:1;display:flex;flex-direction:column;gap:3px}
.cat-badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;align-self:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;cursor:pointer}
.cat-badge:hover{opacity:.8}
.cat-select-inline{font-size:10px;border:1px solid var(--border2);border-radius:4px;padding:2px 5px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--ink);outline:none;max-width:100%;cursor:pointer}
.book-title-wrap{display:flex;align-items:flex-start;gap:3px}
.book-title{font-family:'Lora',serif;font-size:12px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.edit-title-btn{font-size:10px;color:#185FA5;cursor:pointer;border:none;background:none;padding:0;flex-shrink:0;opacity:.45;margin-top:1px}
.edit-title-btn:hover{opacity:1}
.book-author{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;min-height:16px}
.author-unknown{font-style:italic;color:#b0a898}
.edit-author-btn{font-size:10px;color:#185FA5;cursor:pointer;border:none;background:none;padding:0;text-decoration:underline;text-decoration-style:dotted;font-family:'DM Sans',sans-serif;flex-shrink:0}
.inline-input{font-size:11px;width:100%;border:1px solid var(--border2);border-radius:3px;padding:2px 6px;color:var(--ink);background:var(--card);font-family:'DM Sans',sans-serif;outline:none}
/* card actions */
.cactions{padding:7px 8px 8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.action-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}
.btn-group{display:flex;gap:3px}
.bg-btn{flex:1;padding:5px 2px;border:1px solid var(--border);border-radius:5px;background:transparent;cursor:pointer;font-size:9px;font-weight:600;text-align:center;color:var(--muted);line-height:1;transition:all .12s;font-family:'DM Sans',sans-serif}
.bg-btn:hover{border-color:var(--border2);color:var(--ink)}
.bg-btn.sa-not-started{background:#B4B2A9;color:#fff;border-color:transparent}
.bg-btn.sa-in-progress{background:#378ADD;color:#fff;border-color:transparent}
.bg-btn.sa-paused{background:#EF9F27;color:#fff;border-color:transparent}
.bg-btn.sa-completed{background:#639922;color:#fff;border-color:transparent}
.bg-btn.sa-abandoned{background:#E24B4A;color:#fff;border-color:transparent}
.bg-btn.ra-1{background:#A32D2D;color:#fff;border-color:transparent}
.bg-btn.ra-2{background:#854F0B;color:#fff;border-color:transparent}
.bg-btn.ra-3{background:#3B6D11;color:#fff;border-color:transparent}
.bg-btn.ra-4{background:#185FA5;color:#fff;border-color:transparent}
.bg-btn.ra-5{background:#534AB7;color:#fff;border-color:transparent}
/* visitor read+rate */
.vis-read-btn{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:11px;font-weight:500;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .12s;text-align:center}
.vis-read-btn:hover{border-color:#639922;color:#3B6D11}
.vis-read-btn.active{background:#639922;color:#fff;border-color:transparent}
.vis-rating-row{display:flex;gap:3px;align-items:center}
.vis-rl{font-size:9px;color:var(--muted);margin-right:1px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
/* card footer */
.card-footer{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.type-toggle{display:flex;gap:2px}
.tb{padding:3px 6px;border-radius:4px;font-size:9px;font-weight:600;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif}
.tb.active{background:var(--ink);color:var(--bg);border-color:transparent}
.icon-btn{padding:3px 6px;border-radius:4px;font-size:11px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;line-height:1}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn.lent-active{background:#FAEEDA;color:#854F0B;border-color:#EF9F27}
.icon-btn.archived-active{background:var(--surface2);color:var(--muted);border-color:var(--border2)}
.del-btn{padding:3px 5px;border-radius:4px;font-size:12px;border:1px solid var(--border);background:transparent;cursor:pointer;color:#c0b8ae}
.del-btn:hover{color:#e74c3c;border-color:#e74c3c}
/* lend inline */
.lend-inline{background:var(--surface2);border-radius:5px;padding:5px 7px;display:flex;gap:5px;align-items:center;margin-top:2px}
.lend-inline input{flex:1;padding:3px 7px;border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--ink);outline:none}
.lend-confirm{padding:3px 8px;font-size:11px;background:#EF9F27;color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:'DM Sans',sans-serif}
.lend-cancel{padding:3px 5px;font-size:11px;background:transparent;color:var(--muted);border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.no-res{text-align:center;padding:40px;color:var(--muted);font-size:15px;display:none}
@media(max-width:600px){.stat-row{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}}
</style>
</head>
<body>
<header>
  <div class="hinner">
    <div>
      <h1>My <span>Library</span></h1>
      <p id="header-sub">Personal Book Collection</p>
    </div>
  </div>
</header>

<!-- visitor name banner (public mode only) -->
<div class="visitor-banner" id="visitor-banner" style="display:none">
  <div class="visitor-inner" id="visitor-inner"></div>
</div>

<div class="page"><div class="stat-row" id="stats"></div></div>

<div class="sticky-bar">
  <div class="topbar" id="topbar">
    <input type="text" id="search" placeholder="Search title or author…">
    <select id="sortsel">
      <option value="default">Default order</option>
      <option value="title">Title A–Z</option>
      <option value="author">Author A–Z</option>
      <option value="category">Category</option>
      <option value="rating">Best rated first</option>
    </select>
    <select id="stf">
      <option value="">All statuses</option>
      <option value="not-started">Not started</option>
      <option value="in-progress">In progress</option>
      <option value="paused">Paused</option>
      <option value="completed">Completed</option>
      <option value="abandoned">Abandoned</option>
    </select>
    <select id="typef">
      <option value="">All types</option>
      <option value="physical">Physical</option>
      <option value="digital">Digital</option>
      <option value="past">Past Read</option>
    </select>
    <!-- owner-only buttons injected by JS -->
    <span id="owner-btns"></span>
  </div>
  <div class="tabs-wrap" id="tabs"></div>
</div>

<!-- owner panels -->
<div class="panel" id="add-panel">
  <div class="panel-inner">
    <h3>📚 Add a new book</h3>
    <div class="scan-zone" onclick="document.getElementById('scan-file').click()">
      <div style="font-size:22px">📷</div>
      <div style="font-size:13px;font-weight:500;margin-top:3px">Scan book cover to auto-fill details</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">Click to upload a photo</div>
      <input type="file" id="scan-file" accept="image/*" onchange="handleScan(this)">
      <img id="scan-preview" class="scan-preview">
      <div class="scan-status" id="scan-status"></div>
    </div>
    <div class="form-grid">
      <div class="fg" style="grid-column:span 2"><label>Title *</label><input type="text" id="new-title" placeholder="Book title"></div>
      <div class="fg" style="grid-column:span 2"><label>Author</label><input type="text" id="new-author" placeholder="Author name (optional)"></div>
      <div class="fg"><label>Category</label><select id="new-cat"></select></div>
      <div class="fg"><label>Type</label>
        <select id="new-type">
          <option value="physical">Physical</option>
          <option value="digital">Digital</option>
          <option value="past">Past Read (no copy)</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-pri" onclick="addBook()">Add to library</button>
      <button class="btn" onclick="togglePanel('add-panel')">Cancel</button>
    </div>
  </div>
</div>
<div class="panel" id="lent-panel">
  <div class="panel-inner">
    <h3>📤 Currently lent out</h3>
    <div class="lent-list" id="lent-list"></div>
    <div id="lent-empty" style="font-size:13px;color:var(--muted);padding:6px 0;display:none">No books currently lent out.</div>
  </div>
</div>

<div class="page">
  <div class="info" id="info"></div>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
  <div class="no-res" id="nores">No books found.</div>
</div>

<script>
/* ── Mode detection ─────────────────────────────────────────── */
const IS_OWNER = ['localhost','127.0.0.1',''].includes(location.hostname);

/* ── Constants ───────────────────────────────────────────────── */
const CC={'Business & Management':['#E6F1FB','#185FA5'],'Marketing':['#EEEDFE','#3C3489'],'Economics':['#E1F5EE','#0F6E56'],'Entrepreneurship':['#FAECE7','#993C1D'],'Leadership':['#FAEEDA','#633806'],'Self-Help & Productivity':['#FAEEDA','#854F0B'],'Psychology':['#EEEDFE','#534AB7'],'Design':['#E1F5EE','#1D9E75'],'Creativity & Writing':['#FAECE7','#D85A30'],'Parenting & Education':['#EAF3DE','#3B6D11'],'Career & Language':['#F1EFE8','#5F5E5A'],'Investing & Finance':['#EAF3DE','#27500A'],'Science & Health':['#E6F1FB','#0C447C'],'Technology':['#E1F5EE','#085041'],'History & Politics':['#FAEEDA','#412402'],'Philosophy & Spirituality':['#EEEDFE','#26215C'],'Fiction':['#FBEAF0','#72243E'],'Humor & Comics':['#FAEEDA','#633806'],"Children's Fiction":['#FAECE7','#712B13'],'Biography':['#F1EFE8','#2C2C2A'],'Reference':['#F1EFE8','#444441']};

const SC={'not-started':'#B4B2A9','in-progress':'#378ADD','paused':'#EF9F27','completed':'#639922','abandoned':'#E24B4A'};
const RL={1:'Loved',2:'Liked',3:'OK',4:'Meh',5:'Hated'};
const ST_VALS=['not-started','in-progress','paused','completed','abandoned'];
const ST_LBL={'not-started':'New','in-progress':'Now','paused':'Hold','completed':'Done','abandoned':'Drop'};
const ST_TITLE={'not-started':'Not started','in-progress':'In progress','paused':'Paused','completed':'Completed','abandoned':'Abandoned'};
const RT_LBL={1:'Love',2:'Like',3:'OK',4:'Meh',5:'Hate'};
const TYPE_BADGE={physical:'type-physical',digital:'type-digital',past:'type-past'};
const TYPE_TEXT={physical:'Physical',digital:'Digital',past:'Past Read'};

/* ── Custom cover queries ─────────────────────────────────────── */
const CUSTOM_Q={
  1:'intitle:"Who" inauthor:"Geoff Smart" hiring',
  11:'intitle:"Accounting for Non-Accountants" Sphinx Label',
  20:'intitle:"Amul India" advertising Penguin cooperative',
  29:'intitle:"Stay Hungry Stay Foolish" Rashmi Bansal Westland English',
  39:'intitle:"Monk Who Sold His Ferrari" inauthor:"Robin Sharma"',
  56:'intitle:"Body Language" inauthor:"Allan Pease" fast reading',
  65:'intitle:"How to Talk So Kids Will Listen" inauthor:"Faber"',
  66:'intitle:"Between Parent and Child" inauthor:"Ginott" revised new',
  67:'intitle:"Business English" Geffner Barrons professional',
  77:'intitle:"Outlive" inauthor:"Peter Attia" longevity science',
  80:'intitle:"Song of the Cell" inauthor:"Siddhartha Mukherjee"',
  81:'intitle:"Laws of Medicine" inauthor:"Mukherjee" TED',
  82:'intitle:"On the Origin of Species" inauthor:"Darwin"',
  86:'intitle:"Wheatless" inauthor:"Ryan Fernando" diet gluten',
  97:'intitle:"How Prime Ministers Decide" inauthor:"Neerja Chowdhury"',
  98:'intitle:"Speeches that Changed the World" Quercus anthology',
  104:'intitle:"Autobiography Benjamin Franklin" autobiography founding father',
  112:'intitle:"Sure Ways Success" Sivananda Divine Life Society ashram',
  123:'intitle:"Midnights Children" inauthor:"Rushdie" Booker Prize',
  124:'intitle:"Snow Crash" inauthor:"Neal Stephenson" cyberpunk Bantam',
  127:'intitle:"Ultimate Hitchhikers Guide Galaxy" inauthor:"Douglas Adams" omnibus five',
  134:'intitle:"Man Walks Into a Bar" inauthor:"Arnott" jokes pub collection',
  143:'intitle:"Adventures Tom Sawyer" inauthor:"Mark Twain" Oxford',
  147:'intitle:"Britannica Learning Library" encyclopedia',

/* ── Cover queue ─────────────────────────────────────────────────── */
const coverQ=[];let coverBusy=false;
function enqueueCover(id,q,img,ph,priority){
  if(coverCache[id]){applyCover(img,ph,coverCache[id]);return;}
  const item={id,q,img,ph};
  if(priority)coverQ.unshift(item);else coverQ.push(item);
  if(!coverBusy)processQueue();
}
function applyCover(img,ph,url){
  if(!document.contains(img))return;
  img.src=url;img.onload=()=>{img.style.opacity='1';if(ph)ph.style.display='none';};
}
async function processQueue(){
  if(!coverQ.length){coverBusy=false;return;}
  coverBusy=true;
  const{id,q,img,ph}=coverQ.shift();
  try{
    const res=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&langRestrict=en&maxResults=3&fields=items/volumeInfo/imageLinks`);
    const data=await res.json();
    const url=data.items?.find(i=>i.volumeInfo?.imageLinks?.thumbnail)?.volumeInfo?.imageLinks?.thumbnail?.replace('http:','https:');
    if(url){coverCache[id]=url;saveCV();applyCover(img,ph,url);}
  }catch(e){}
  setTimeout(processQueue,180);
}
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){obs.unobserve(e.target);
      const id=+e.target.dataset.id,b=getAllBooks().find(x=>x.id===id);if(!b)return;
      const img=e.target.querySelector('.cover-img'),ph=e.target.querySelector('.cover-ph');if(!img)return;
      enqueueCover(id,buildQ(id,getTitle(b),getAuthor(b)),img,ph,false);
    }
  });
},{rootMargin:'80px'});
function refreshCover(id){
  delete coverCache[id];saveCV();
  const card=document.querySelector(`.card[data-id="${id}"]`);if(!card)return;
  const img=card.querySelector('.cover-img'),ph=card.querySelector('.cover-ph');
  if(img){img.style.opacity='0';img.src='';}
  if(ph)ph.style.display='flex';
  const b=getAllBooks().find(x=>x.id===id);if(!b)return;
  enqueueCover(id,buildQ(id,getTitle(b),getAuthor(b)),img,ph,true);
}

/* ── Helpers ──────────────────────────────────────────────────────── */
function getType(id){return userData[id]?.type||'physical';}
function isArchived(id){return!!userData[id]?.archived;}
function isLent(id){return!!(userData[id]?.lentTo);}
function getFiltered(){
  let b=getAllBooks();
  if(IS_OWNER){
    b=b.filter(x=>showArchived?isArchived(x.id):!isArchived(x.id));
  } else {
    b=b.filter(x=>!isArchived(x.id));
  }
  if(search){const q=search.toLowerCase();b=b.filter(x=>getTitle(x).toLowerCase().includes(q)||getAuthor(x).toLowerCase().includes(q));}
  if(activeCat)b=b.filter(x=>getCat(x)===activeCat);
  if(stFilter)b=b.filter(x=>(userData[x.id]?.status||'not-started')===stFilter);
  if(typeFilter)b=b.filter(x=>getType(x.id)===typeFilter);
  if(sortBy==='title')b.sort((a,x)=>getTitle(a).localeCompare(getTitle(x)));
  else if(sortBy==='author')b.sort((a,x)=>getAuthor(a).localeCompare(getAuthor(x)));
  else if(sortBy==='category')b.sort((a,x)=>getCat(a).localeCompare(getCat(x)));
  else if(sortBy==='rating')b.sort((a,x)=>(userData[a.id]?.rating||99)-(userData[x.id]?.rating||99));
  return b;
}
function updateStats(){
  const all=getAllBooks().filter(b=>!isArchived(b.id));
  const done=Object.values(userData).filter(d=>d.status==='completed').length;
  const prog=Object.values(userData).filter(d=>d.status==='in-progress').length;
  const rated=Object.values(userData).filter(d=>d.rating!=null).length;
  const lentCt=all.filter(b=>isLent(b.id)).length;
  const arcCt=getAllBooks().filter(b=>isArchived(b.id)).length;
  if(IS_OWNER){
    document.getElementById('stats').innerHTML=[['Total',all.length],['Completed',done],['Reading',prog],['Rated',rated],['Lent',lentCt],['Archived',arcCt]].map(([k,v])=>`<div class="sc"><div class="sv">${v}</div><div class="sk">${k}</div></div>`).join('');
  } else {
    const visReadCt=Object.values(visitorRead).filter(v=>v).length;
    const visRateCt=Object.values(visitorRating).filter(v=>v).length;

function showCatSelect(id){

function showLendForm(id){

function rebuildTabs(){
  const visible=getAllBooks().filter(b=>showArchived?isArchived(b.id):!isArchived(b.id));
  const cats=[...new Set(visible.map(b=>getCat(b)))].sort();
  const el=document.getElementById('tabs');el.innerHTML='';
  function mkT(label,cat){
    const t=document.createElement('button');t.className='tab'+(cat===activeCat?' active':'');
    t.textContent=label;t.dataset.cat=cat||'';
    t.onclick=()=>{activeCat=cat;el.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.cat===(cat||'')));render();};
    el.appendChild(t);
  }
  mkT(`All (${visible.length})`,'');
  cats.forEach(c=>mkT(`${c} (${visible.filter(b=>getCat(b)===c).length})`,c));
}

/* ── Event delegation ─────────────────────────────────────────────── */
document.getElementById('grid').addEventListener('click',e=>{
  if(IS_OWNER){
    /* Status */
    const sb=e.target.closest('[data-st-id]');
    if(sb){const id=+sb.dataset.stId,s=sb.dataset.s;if(!userData[id])userData[id]={};userData[id].status=s;saveUD();const card=document.querySelector(`.card[data-id="${id}"]`);if(card)applyStatusToCard(card,id,s);updateStats();if(stFilter&&stFilter!==s)render();return;}
    /* Rating + auto-done */
    const rb=e.target.closest('[data-rt-id]');
    if(rb){const id=+rb.dataset.rtId,r=+rb.dataset.r;if(!userData[id])userData[id]={};userData[id].rating=userData[id].rating===r?null:r;if(userData[id].rating!==null)userData[id].status='completed';saveUD();const card=document.querySelector(`.card[data-id="${id}"]`);if(card){card.querySelectorAll('[data-rt-id]').forEach(b=>{b.className='bg-btn'+(+b.dataset.r===userData[id].rating?' ra-'+userData[id].rating:'');});applyStatusToCard(card,id,userData[id].status||'not-started');}updateStats();if(sortBy==='rating')render();return;}
    /* Type */
    const tb=e.target.closest('.tb');
    if(tb){const id=+tb.dataset.typeId,tp=tb.dataset.t;if(!userData[id])userData[id]={};userData[id].type=tp;saveUD();const card=document.querySelector(`.card[data-id="${id}"]`);if(card){card.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.t===tp));const badge=card.querySelector('.type-badge');if(badge){badge.textContent=TYPE_TEXT[tp];badge.className='type-badge '+TYPE_BADGE[tp];}}updateStats();if(typeFilter&&typeFilter!==tp)render();return;}
    /* Lend */
    const lb=e.target.closest('[data-lend-id]');if(lb){showLendForm(+lb.dataset.lendId);return;}
    const lc=e.target.closest('[data-lend-confirm]');if(lc){confirmLend(+lc.dataset.lendConfirm);return;}
    const lx=e.target.closest('[data-lend-cancel]');if(lx){const f=document.getElementById('lf-'+lx.dataset.lendCancel);if(f)f.style.display='none';return;}
    /* Archive */
    const ab=e.target.closest('[data-archive-id]');if(ab){const id=+ab.dataset.archiveId;if(!userData[id])userData[id]={};userData[id].archived=!userData[id].archived;saveUD();render();return;}
    /* Refresh */
    const rfb=e.target.closest('[data-refresh-id]');if(rfb){refreshCover(+rfb.dataset.refreshId);return;}
    /* Edit category */
    const ecb=e.target.closest('[data-edit-cat-id]');if(ecb){showCatSelect(+ecb.dataset.editCatId);return;}
    /* Edit title */
    const etb=e.target.closest('[data-edit-title-id]');if(etb){showTitleInput(+etb.dataset.editTitleId);return;}
    /* Edit author */
    const eb=e.target.closest('[data-edit-id]');if(eb){showAuthorInput(+eb.dataset.editId);return;}
    /* Delete */
    const db=e.target.closest('[data-del-id]');if(db){const id=+db.dataset.delId;if(confirm('Remove this book?')){customBooks=customBooks.filter(b=>b.id!==id);delete userData[id];saveCus();saveUD();render();}return;}
  } else {
    /* Visitor: mark read */
    const vr=e.target.closest('[data-vread-id]');
    if(vr){const id=+vr.dataset.vreadId;visitorRead[id]=!visitorRead[id];saveVis();const btn=vr;btn.className='vis-read-btn'+(visitorRead[id]?' active':'');btn.textContent=visitorRead[id]?'✓ I\'ve read this':'Mark as read';const badge=document.querySelector(`.card[data-id="${id}"] .vis-read-badge`);if(badge){badge.style.display=visitorRead[id]?'block':'none';}else if(visitorRead[id]){const cw=document.querySelector(`.card[data-id="${id}"] .cover-wrap`);if(cw){const d=document.createElement('div');d.className='vis-read-badge';d.textContent='✓ Read by you';cw.appendChild(d);}}updateStats();return;}
    /* Visitor: rating */
    const vrt=e.target.closest('[data-vrt-id]');
    if(vrt){const id=+vrt.dataset.vrtId,r=+vrt.dataset.r;visitorRating[id]=visitorRating[id]===r?null:r;saveVis();const card=document.querySelector(`.card[data-id="${id}"]`);if(card){const nr=visitorRating[id];card.querySelectorAll('[data-vrt-id]').forEach(b=>{b.className='bg-btn'+(+b.dataset.r===nr?' ra-'+nr:'');});}updateStats();return;}
  }
});

/* ── Scan ─────────────────────────────────────────────────────────── */
function resetScanUI(){document.getElementById('scan-status').textContent='';const p=document.getElementById('scan-preview');p.style.display='none';p.src='';document.getElementById('scan-file').value='';}
async function handleScan(input){
  const file=input.files[0];if(!file)return;
  const statusEl=document.getElementById('scan-status'),preview=document.getElementById('scan-preview');
  const reader=new FileReader();reader.onload=ev=>{preview.src=ev.target.result;preview.style.display='block';};reader.readAsDataURL(file);
  statusEl.innerHTML='<span class="spinner"></span> Analysing cover…';
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},{type:'text',text:'Look at this book cover. Return ONLY a JSON object with keys: title (string), author (string or empty string), category (pick best from: '+ALL_CATS.join(', ')+').  Return ONLY valid JSON, no markdown.'}]}]})});
    const data=await resp.json();
    const raw=data.content?.find(c=>c.type==='text')?.text||'{}';
    const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(parsed.title)document.getElementById('new-title').value=parsed.title;
    if(parsed.author)document.getElementById('new-author').value=parsed.author;
    if(parsed.category&&catSel.querySelector(`option[value="${parsed.category}"]`))catSel.value=parsed.category;
    statusEl.textContent=parsed.title?`✓ Found: "${parsed.title}"${parsed.author?' by '+parsed.author:''}. Review and click Add.`:'Could not parse — fill manually.';
  }catch(err){statusEl.textContent='Could not parse image — please fill in manually.';}
}

/* ── Download CSV ─────────────────────────────────────────────────── */
function downloadCSV(){
  const rows=[['#','Title','Author','Category','Type','Status','Rating','Rating label','Lent to','Archived']];
  getAllBooks().forEach(b=>{const ud=userData[b.id]||{};rows.push([b.id,`"${getTitle(b).replace(/"/g,'""')}"`,`"${getAuthor(b).replace(/"/g,'""')}"`,`"${getCat(b)}"`,ud.type||'physical',ud.status||'not-started',ud.rating||'',ud.rating?RL[ud.rating]:'',ud.lentTo||'',ud.archived?'yes':'']);});
  const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='my-library.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

/* ── Init ─────────────────────────────────────────────────────────── */
loadLS();
if(IS_OWNER){
  buildOwnerUI();
} else {
  buildVisitorUI();
  /* In visitor mode, hide status filter from topbar */
  const sf=document.getElementById('stf');if(sf)sf.style.display='none';
}
updateStats();render();
</script>
